backend:
  name: git-gateway
  branch: main

media_folder: "church-gallery/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Church Programs"
    folder: "church-gallery/content"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Unique ID", name: "id", widget: "id" }
      - { label: "Program Theme / Title", name: "title", widget: "string" }
      - { label: "Date of Event", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Brief Description", name: "description", widget: "text" }
      - { label: "Photo Gallery", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
