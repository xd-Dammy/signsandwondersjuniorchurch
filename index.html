<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCCG Signs & Wonders Juniors Church Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header>
        <!-- Place your logo.png inside images/uploads/ folder -->
        <img src="images/uploads/logo.png" alt="RCCG Signs and Wonders Junior Affairs Logo" class="church-logo" onerror="this.style.display='none'; console.log('Place your logo.png inside images/uploads/')">
        <h1>RCCG Signs & Wonders Juniors Church</h1>
        <h3>Junior Media Gallery Platform</h3>
    </header>

    <main>
        <section id="gallery-container">
            <div class="loading-state">Initializing gallery pipeline...</div>
        </section>
    </main>

    <!-- Photo Lightbox Modal View layer -->
    <div id="lightbox-modal" class="modal" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modal-img">
        <div id="caption"></div>
        <a id="download-link" href="#" download class="download-btn" onclick="event.stopPropagation();">⬇ Download Image</a>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
